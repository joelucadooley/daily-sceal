name: Add a story

# Adds RTÉ stories to today's stories by link, for a story the morning run did
# not pick (a feature from last week, say). Each page is read and marked the
# same way as the morning run; the stories already there are left alone.
#
# From the GitHub app or github.com: Actions, Add a story, Run workflow, paste
# the RTÉ link. Several links can go in at once, separated by spaces. Run it
# after the morning run has finished: it refuses yesterday's today.json.

on:
  workflow_dispatch:
    inputs:
      links:
        description: 'RTÉ link to add (for several, separate with spaces)'
        required: true

concurrency:
  group: add-story
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    # One story is a page read and three levels of MyMemory calls: a few
    # minutes at most.
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No npm install: add-story.js uses nothing outside this repo.
      - name: Add the stories
        env:
          LINKS: ${{ github.event.inputs.links }}
        run: node scripts/add-story.js "$LINKS"

      - name: Commit and push today.json
        run: |
          git config user.name "Daily Scéal Bot"
          git config user.email "bot@daily-sceal"
          git add public/data
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "➕ Added story $(date '+%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin main
          git push origin main

      - name: Trigger deploy
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/joelucadooley/daily-sceal/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
