name: Generate Daily Stories

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install && npm install @xmldom/xmldom

      - name: Run generation script
        run: node scripts/generate.js

      - name: Commit and push today.json
        run: |
          git config user.name "Daily Scéal Bot"
          git config user.email "bot@daily-sceal"
          git checkout -- .
          git pull origin main
          git add public/data/today.json
          git commit -m "📰 Daily stories $(date '+%Y-%m-%d %H:%M:%S')" --allow-empty
          git push origin main

      - name: Trigger deploy
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/joelucadooley/daily-sceal/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
