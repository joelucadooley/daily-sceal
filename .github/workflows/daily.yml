name: Generate Daily Stories

on:
  schedule:
    # Runs at 7:00 AM UTC every day
    - cron: "0 7 * * *"
  # Allows you to run this manually from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --include=dev && npm install @xmldom/xmldom

      - name: Run generation script
        run: node scripts/generate.js

      - name: Commit and push today.json
        run: |
          git config user.name "Daily Scéal Bot"
          git config user.email "bot@daily-sceal"
          git add public/data/today.json
          git diff --staged --quiet || git commit -m "📰 Daily stories $(date +%Y-%m-%d)"
          git push
