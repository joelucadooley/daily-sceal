<!doctype html>
<!-- The Bearnaí link preview, 1200×630. Drawn by scripts/bearnai-cards.mjs:
     no ?r gives the plain card (public/og-bearnai.png); ?r=11011 fills the
     gaps green for right and red for wrong (public/bearnai/11011.png). -->
<html><body style="margin:0"><canvas id="c" width="1200" height="630"></canvas>
<script>
const W = 1200, H = 630, NAVY = "#0d2137", AMBER = "#e8951e", BLUE = "#2563eb", GREEN = "#15803d", RED = "#b91c1c", SERIF = "Georgia, serif";
const r = new URLSearchParams(location.search).get("r") || "";
const c = document.getElementById("c"), ctx = c.getContext("2d");
function rr(x, y, w, h, rad) { ctx.beginPath(); ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad); ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath(); }
ctx.fillStyle = AMBER; ctx.fillRect(0, 0, W, H);
ctx.fillStyle = NAVY; ctx.fillRect(0, 0, W, 10);
const T = 264;
ctx.textAlign = "center"; ctx.fillStyle = NAVY;
ctx.font = `bold 150px ${SERIF}`; ctx.fillText("Bearnaí", W / 2, T);
// The five gaps: white with the first one to find, or the score in green and red.
const gw = 100, gh = 50, gap = 18, total = 5 * gw + 4 * gap; let x = (W - total) / 2; const y = T + 48;
for (let i = 0; i < 5; i++) {
  rr(x, y, gw, gh, 14);
  if (r) { ctx.fillStyle = r[i] === "1" ? GREEN : RED; ctx.fill(); }
  else { ctx.fillStyle = i === 0 ? "#ffffff" : "rgba(255,255,255,0.45)"; ctx.fill(); if (i === 0) { ctx.lineWidth = 4; ctx.strokeStyle = BLUE; ctx.stroke(); } }
  x += gw + gap;
}
// "A new game by Daily Scéal" in a navy box, the name in the logo's own colours.
ctx.textAlign = "left";
const by = T + 200;
ctx.font = `italic 44px ${SERIF}`; const a = "A new game by ", aw = ctx.measureText(a).width;
ctx.font = `bold 44px ${SERIF}`; const d = "Daily ", dw = ctx.measureText(d).width, sw = ctx.measureText("Scéal").width;
const tw = aw + dw + sw, padX = 36, bh = 80;
let sx = W / 2 - tw / 2;
rr(sx - padX, by - 52, tw + 2 * padX, bh, 20); ctx.fillStyle = NAVY; ctx.fill();
ctx.font = `italic 44px ${SERIF}`; ctx.fillStyle = "#c3ccd8"; ctx.fillText(a, sx, by);
ctx.font = `bold 44px ${SERIF}`; ctx.fillStyle = "#ffffff"; ctx.fillText(d, sx + aw, by);
ctx.fillStyle = AMBER; ctx.fillText("Scéal", sx + aw + dw, by);
</script></body></html>
